HOW TO RUN:
1. Copy this entire code block.
2. Save it as a file named "puzzle.html" on your computer.
3. Double-click "puzzle.html" to open it in any modern web browser (Chrome, Firefox, Safari, Edge).
4. Play!
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --board-bg: #2d3748;
            --tile-bg: #ffffff;
            --tile-text: #2d3748;
            --tile-hover: #e2e8f0;
            --accent: #3182ce;
            --accent-hover: #2b6cb0;
            --text-main: #1a202c;
            --shadow: 0 10px 20px rgba(0,0,0,0.2);
            --board-size: min(90vw, 500px);
            --n: 4; /* Controlled by JS */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, select {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        button:hover, select:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        select {
            background-color: white;
            color: var(--text-main);
            border: 2px solid var(--accent);
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .stat span {
            color: #718096;
            margin-right: 5px;
        }

        .board-wrapper {
            background-color: var(--board-bg);
            border-radius: 16px;
            padding: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), var(--shadow);
        }

        .board-container {
            width: var(--board-size);
            height: var(--board-size);
            position: relative;
        }

        .tile {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% / var(--n));
            height: calc(100% / var(--n));
            
            background-color: var(--tile-bg);
            color: var(--tile-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: calc(var(--board-size) / (var(--n) * 2.5));
            
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 -6px 0 rgba(0,0,0,0.05);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            
            --tx: 0%;
            --ty: 0%;
            
            transform: translate(var(--tx), var(--ty)) scale(0.92);
            transform-origin: center;
            
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s;
        }

        .tile:not(.empty):hover {
            background-color: var(--tile-hover);
        }

        .tile.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--tile-bg);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            color: var(--text-main);
        }

        .modal-content h2 { margin-bottom: 10px; color: var(--accent); }
        .modal-stats { margin: 20px 0; font-size: 1.2rem; display: flex; gap: 30px; justify-content: center; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sliding Puzzle</h1>
    </header>

    <main>
        <div class="controls">
            <select id="difficulty" aria-label="Select Difficulty">
                <option value="3">3x3 (Easy)</option>
                <option value="4" selected>4x4 (Classic)</option>
                <option value="5">5x5 (Hard)</option>
            </select>
            <button id="new-game">New Game</button>
            <button id="reset-game">Reset</button>
        </div>

        <div class="stats">
            <div class="stat"><span>Moves:</span> <strong id="moves">0</strong></div>
            <div class="stat"><span>Time:</span> <strong id="timer">00:00</strong></div>
        </div>

        <div class="board-wrapper">
            <div class="board-container" id="board-container">
                <!-- Tiles are injected here via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Custom Win Modal -->
    <div id="win-modal" class="modal">
        <div class="modal-content">
            <h2>🎉 Congratulations!</h2>
            <p>You solved the puzzle!</p>
            <div class="modal-stats">
                <div><strong>Moves:</strong> <span id="modal-moves">0</span></div>
                <div><strong>Time:</strong> <span id="modal-time">00:00</span></div>
            </div>
            <button id="close-modal">Play Again</button>
        </div>
    </div>

    <script>
        class PuzzleGame {
            constructor() {
                this.N = 4; // Grid size
                this.board = []; // Current state
                this.initialBoard = []; // State for the reset button
                this.moves = 0;
                this.time = 0;
                this.timerInterval = null;
                this.isStarted = false;
                this.isAnimating = false;
                
                // Cache DOM elements
                this.elements = {
                    boardContainer: document.getElementById('board-container'),
                    movesDisplay: document.getElementById('moves'),
                    timerDisplay: document.getElementById('timer'),
                    newGameBtn: document.getElementById('new-game'),
                    resetBtn: document.getElementById('reset-game'),
                    difficultySelect: document.getElementById('difficulty'),
                    modal: document.getElementById('win-modal'),
                    modalMoves: document.getElementById('modal-moves'),
                    modalTime: document.getElementById('modal-time'),
                    closeModalBtn: document.getElementById('close-modal')
                };

                this.init();
            }

            init() {
                this.attachEventListeners();
                this.startNewGame();
            }

            attachEventListeners() {
                this.elements.newGameBtn.addEventListener('click', () => this.startNewGame());
                this.elements.resetBtn.addEventListener('click', () => this.resetGame());
                
                this.elements.difficultySelect.addEventListener('change', (e) => {
                    this.N = parseInt(e.target.value);
                    this.startNewGame();
                });

                this.elements.closeModalBtn.addEventListener('click', () => {
                    this.elements.modal.classList.remove('active');
                    this.startNewGame();
                });
                
                // Event delegation for tile clicks
                this.elements.boardContainer.addEventListener('click', (e) => {
                    if (this.isAnimating) return;
                    const tileEl = e.target.closest('.tile');
                    if (!tileEl || tileEl.classList.contains('empty')) return;
                    
                    const tileValue = parseInt(tileEl.dataset.id);
                    this.handleMove(tileValue);
                });

                // Keyboard support
                window.addEventListener('keydown', (e) => {
                    if (this.isAnimating) return;
                    const blankPos = this.findBlank();
                    let targetRow = blankPos.r;
                    let targetCol = blankPos.c;

                    // Arrow keys dictate which tile slides into the empty space
                    if (e.key === 'ArrowUp') targetRow++;
                    else if (e.key === 'ArrowDown') targetRow--;
                    else if (e.key === 'ArrowLeft') targetCol++;
                    else if (e.key === 'ArrowRight') targetCol--;
                    else return;

                    if (targetRow >= 0 && targetRow < this.N && targetCol >= 0 && targetCol < this.N) {
                        const tileValue = this.board[targetRow][targetCol];
                        this.handleMove(tileValue);
                    }
                });
            }

            // --- GAME FLOW ---

            startNewGame() {
                this.stopTimer();
                this.isStarted = false;
                this.moves = 0;
                this.time = 0;
                this.updateStats();
                
                this.board = this.generateSolvableBoard(this.N);
                this.initialBoard = this.board.map(r => [...r]);
                
                // Update CSS variable for grid size
                this.elements.boardContainer.style.setProperty('--n', this.N);
                this.renderBoard();
            }

            resetGame() {
                this.stopTimer();
                this.isStarted = false;
                this.moves = 0;
                this.time = 0;
                this.updateStats();
                
                this.board = this.initialBoard.map(r => [...r]);
                this.renderBoard();
            }

            // --- LOGIC & SOLVABILITY ---

            generateSolvableBoard(N) {
                while(true) {
                    let nums = [];
                    for(let i=1; i<N*N; i++) nums.push(i);
                    nums.push(0);
                    
                    // Fisher-Yates shuffle
                    for(let i=nums.length-1; i>0; i--) {
                        let j = Math.floor(Math.random() * (i+1));
                        [nums[i], nums[j]] = [nums[j], nums[i]];
                    }
                    
                    let board = [];
                    for(let r=0; r<N; r++) {
                        board.push(nums.slice(r*N, (r+1)*N));
                    }
                    
                    if(this.isSolvable(board, N)) return board;
                }
            }

            getInversions(board, N) {
                let flat = board.flat().filter(n => n !== 0);
                let inv = 0;
                for(let i=0; i<flat.length-1; i++) {
                    for(let j=i+1; j<flat.length; j++) {
                        if(flat[i] > flat[j]) inv++;
                    }
                }
                return inv;
            }

            isSolvable(board, N) {
                let inversions = this.getInversions(board, N);
                
                // Odd grid width (3x3, 5x5): Solvable if inversions is even
                if (N % 2 !== 0) {
                    return inversions % 2 === 0;
                } 
                
                // Even grid width (4x4): Depends on blank row from bottom
                let blankRowFromBottom = -1;
                for(let r = N - 1; r >= 0; r--) {
                    if(board[r].includes(0)) {
                        blankRowFromBottom = N - r; // 1-indexed from bottom
                        break;
                    }
                }
                
                if (blankRowFromBottom % 2 === 0) {
                    // Even row from bottom -> odd inversions
                    return inversions % 2 !== 0;
                } else {
                    // Odd row from bottom -> even inversions
                    return inversions % 2 === 0;
                }
            }

            findBlank() {
                for(let r=0; r<this.N; r++) {
                    for(let c=0; c<this.N; c++) {
                        if(this.board[r][c] === 0) return {r, c};
                    }
                }
                return null;
            }

            checkWin() {
                let expected = 1;
                for(let r=0; r<this.N; r++) {
                    for(let c=0; c<this.N; c++) {
                        if(r === this.N-1 && c === this.N-1) {
                            if(this.board[r][c] !== 0) return false;
                        } else {
                            if(this.board[r][c] !== expected) return false;
                            expected++;
                        }
                    }
                }
                return true;
            }

            // --- INTERACTION & RENDERING ---

            handleMove(tileValue) {
                if (this.isAnimating) return;
                
                const blank = this.findBlank();
                let tilePos = null;
                
                // Find coordinates of the clicked tile
                for(let r=0; r<this.N; r++) {
                    for(let c=0; c<this.N; c++) {
                        if(this.board[r][c] === tileValue) {
                            tilePos = {r, c};
                            break;
                        }
                    }
                    if(tilePos) break;
                }

                if(!tilePos) return;

                const dr = Math.abs(blank.r - tilePos.r);
                const dc = Math.abs(blank.c - tilePos.c);
                const isAdjacent = (dr === 1 && dc === 0) || (dr === 0 && dc === 1);

                if(isAdjacent) {
                    // Start timer on first valid move
                    if(!this.isStarted) {
                        this.startTimer();
                        this.isStarted = true;
                    }

                    // Lock interactions during animation
                    this.isAnimating = true;

                    // Swap in game state
                    this.board[blank.r][blank.c] = tileValue;
                    this.board[tilePos.r][tilePos.c] = 0;

                    this.moves++;
                    this.updateStats();

                    // Update DOM positions
                    this.updateDOMTile(tileValue, blank.r, blank.c);
                    this.updateDOMTile(0, tilePos.r, tilePos.c);

                    // Unlock interactions after animation finishes
                    setTimeout(() => {
                        this.isAnimating = false;
                        if(this.checkWin()) {
                            this.stopTimer();
                            this.showWinMessage();
                        }
                    }, 250); // Match CSS transition time
                }
            }

            updateDOMTile(value, newRow, newCol) {
                const tileEl = this.elements.boardContainer.querySelector(`[data-id="${value}"]`);
                if(tileEl) {
                    // Update CSS variables to trigger transform transition
                    tileEl.style.setProperty('--tx', `${newCol * 100}%`);
                    tileEl.style.setProperty('--ty', `${newRow * 100}%`);
                }
            }

            renderBoard() {
                this.elements.boardContainer.innerHTML = '';
                
                for(let r=0; r<this.N; r++) {
                    for(let c=0; c<this.N; c++) {
                        const value = this.board[r][c];
                        const tile = document.createElement('div');
                        tile.className = `tile ${value === 0 ? 'empty' : ''}`;
                        tile.dataset.id = value;
                        
                        if(value !== 0) {
                            tile.textContent = value;
                        }
                        
                        // Set initial position immediately
                        tile.style.setProperty('--tx', `${c * 100}%`);
                        tile.style.setProperty('--ty', `${r * 100}%`);
                        
                        this.elements.boardContainer.appendChild(tile);
                    }
                }
            }

            // --- UTILITIES ---

            updateStats() {
                this.elements.movesDisplay.textContent = this.moves;
                this.elements.timerDisplay.textContent = this.formatTime(this.time);
            }

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.time++;
                    this.updateStats();
                }, 1000);
            }

            stopTimer() {
                if(this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            showWinMessage() {
                setTimeout(() => {
                    this.elements.modalMoves.textContent = this.moves;
                    this.elements.modalTime.textContent = this.formatTime(this.time);
                    this.elements.modal.classList.add('active');
                }, 300); // Slight delay so final slide animation completes
            }
        }

        // Initialize Game
        document.addEventListener('DOMContentLoaded', () => {
            new PuzzleGame();
        });
    </script>
</body>
</html>
