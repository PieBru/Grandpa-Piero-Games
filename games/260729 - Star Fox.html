<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Fox - Space Combat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; cursor: crosshair; }
canvas { display: block; }

#hud {
  position: fixed; top: 0; left: 0; width: 100%; padding: 15px 25px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; z-index: 10;
}
.hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; }
.hud-center { text-align: center; }

#health-bar-container {
  width: 200px; height: 18px; background: rgba(0,0,0,0.7);
  border: 2px solid #0ff; border-radius: 9px; overflow: hidden;
}
#health-bar {
  width: 100%; height: 100%;
  background: linear-gradient(90deg, #0f0, #0ff);
  transition: width 0.3s; border-radius: 7px;
}
#health-label { color: #0ff; font-size: 12px; text-shadow: 0 0 5px #0ff; }

.score-display { color: #ffd700; font-size: 22px; font-weight: bold; text-shadow: 0 0 10px #ffd700; }
.lives-display { color: #ff6b6b; font-size: 18px; text-shadow: 0 0 8px #ff6b6b; }
.level-display { color: #fff; font-size: 16px; text-shadow: 0 0 8px #fff; }

#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(0,255,255,0.7);
}
#crosshair::before { width: 20px; height: 2px; top: -1px; left: -10px; }
#crosshair::after { width: 2px; height: 20px; left: -1px; top: -10px; }

#minimap {
  position: fixed; bottom: 20px; right: 20px; width: 160px; height: 160px;
  background: rgba(0,10,30,0.8); border: 2px solid #0ff; border-radius: 50%;
  z-index: 10; pointer-events: none; overflow: hidden;
}
#minimap-canvas { width: 100%; height: 100%; }

#message-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; background: rgba(0,0,0,0.85);
}
#message-overlay.active { display: flex; }
#message-title {
  font-size: 60px; font-weight: bold; color: #ffd700;
  text-shadow: 0 0 30px #ffd700, 0 0 60px #ff6600;
  margin-bottom: 20px; letter-spacing: 5px;
}
#message-subtitle {
  font-size: 24px; color: #fff; text-shadow: 0 0 15px #0ff;
  margin-bottom: 40px;
}
#message-btn {
  padding: 15px 50px; font-size: 22px; background: linear-gradient(180deg, #0ff, #066);
  color: #000; border: none; border-radius: 8px; cursor: pointer;
  font-weight: bold; letter-spacing: 2px; display: none;
}
#message-btn:hover { background: linear-gradient(180deg, #fff, #0ff); }

#controls-info {
  position: fixed; bottom: 20px; left: 20px; color: rgba(255,255,255,0.5);
  font-size: 12px; z-index: 10; pointer-events: none; line-height: 1.8;
}

#powerup-indicator {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  color: #ffd700; font-size: 18px; font-weight: bold;
  text-shadow: 0 0 10px #ffd700; z-index: 10; pointer-events: none;
  display: none;
}

#boss-health-container {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  width: 400px; height: 14px; background: rgba(0,0,0,0.8);
  border: 2px solid #f00; border-radius: 7px; overflow: hidden;
  display: none; z-index: 10; pointer-events: none;
}
#boss-health-bar {
  width: 100%; height: 100%;
  background: linear-gradient(90deg, #f00, #ff0);
  transition: width 0.2s; border-radius: 5px;
}
#boss-name {
  position: fixed; top: 55px; left: 50%; transform: translateX(-50%);
  color: #f44; font-size: 16px; font-weight: bold;
  text-shadow: 0 0 10px #f00; z-index: 10; pointer-events: none; display: none;
}

#weapon-display {
  position: fixed; top: 80px; right: 25px; color: #0ff;
  font-size: 14px; text-shadow: 0 0 5px #0ff; z-index: 10;
  pointer-events: none;
}
#fire-indicator {
  position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 14px; z-index: 10; pointer-events: none;
  opacity: 0; transition: opacity 0.1s;
  text-shadow: 0 0 8px #0ff;
}
</style>
</head>
<body>

<div id="hud">
  <div class="hud-left">
    <div id="health-label">SHIELD</div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    <div class="lives-display" id="lives-display">♥ ♥ ♥</div>
  </div>
  <div class="hud-center">
    <div class="score-display" id="score-display">0</div>
    <div class="level-display" id="level-display">LEVEL 1 - CORONAR SYSTEM</div>
  </div>
  <div class="hud-right">
    <div id="weapon-display">BLASTER</div>
  </div>
</div>

<div id="crosshair"></div>

<div id="boss-name">BOSS NAME</div>
<div id="boss-health-container"><div id="boss-health-bar"></div></div>

<div id="powerup-indicator"></div>
<div id="fire-indicator">FIRING</div>

<div id="minimap"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>

<div id="message-overlay" class="active">
  <div id="message-title">STAR FOX</div>
  <div id="message-subtitle">Space Combat Mission</div>
  <button id="message-btn" onclick="startGame()">START MISSION</button>
  <div id="start-controls" style="color:rgba(255,255,255,0.6);font-size:13px;margin-top:20px;text-align:center;line-height:2;">
    <strong>CONTROLS</strong><br>
    WASD / Arrow Keys - Move Ship<br>
    Mouse - Aim / Look<br>
    Left Click / Space - Fire<br>
    Shift - Boost (uses energy)<br>
    P - Pause
  </div>
</div>

<div id="controls-info">
  WASD/Arrows: Move &nbsp;|&nbsp; Mouse: Aim &nbsp;|&nbsp; Click/Space: Fire &nbsp;|&nbsp; Shift: Boost
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== GAME STATE =====================
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, LEVELCOMPLETE: 4, WIN: 5 };
let gameState = STATE.MENU;
let score = 0;
let lives = 3;
let currentLevel = 0;
let bossActive = false;
let boss = null;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let powerups = [];
let stars = [];
let asteroids = [];
let explosions = [];
let frameCount = 0;
let lastTime = 0;
let deltaTime = 0;
let mouseDown = false;
let fireTimer = 0;
let boostEnergy = 100;
let isBoosting = false;
let weaponType = 'blaster';
let powerupTimer = 0;
let shakeAmount = 0;

// ===================== THREE.JS SETUP =====================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000011, 0.0008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 200, 100);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x0088ff, 1, 500);
pointLight.position.set(0, 50, 0);
scene.add(pointLight);

// ===================== PLAYER SHIP =====================
let player;
function createPlayerShip() {
  const group = new THREE.Group();

  // Main body
  const bodyGeo = new THREE.ConeGeometry(1.5, 8, 8);
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0x2266cc, shininess: 100, flatShading: true });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.rotation.x = Math.PI / 2;
  group.add(body);

  // Cockpit
  const cockpitGeo = new THREE.SphereGeometry(1, 8, 6);
  const cockpitMat = new THREE.MeshPhongMaterial({ color: 0x88ccff, transparent: true, opacity: 0.7, shininess: 200 });
  const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
  cockpit.position.set(0, 0.5, 1);
  cockpit.scale.set(1, 0.6, 1.5);
  group.add(cockpit);

  // Wings
  const wingGeo = new THREE.BoxGeometry(8, 0.2, 3);
  const wingMat = new THREE.MeshPhongMaterial({ color: 0x1144aa, shininess: 80 });
  const wings = new THREE.Mesh(wingGeo, wingMat);
  wings.position.set(0, -0.5, 1);
  group.add(wings);

  // Wing tips
  const tipGeo = new THREE.ConeGeometry(0.4, 2, 4);
  const tipMat = new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0x330000 });
  const leftTip = new THREE.Mesh(tipGeo, tipMat);
  leftTip.position.set(-4.5, 0, 2);
  leftTip.rotation.z = Math.PI / 2;
  group.add(leftTip);
  const rightTip = new THREE.Mesh(tipGeo, tipMat);
  rightTip.position.set(4.5, 0, 2);
  rightTip.rotation.z = -Math.PI / 2;
  group.add(rightTip);

  // Engine pods
  const engineGeo = new THREE.CylinderGeometry(0.6, 0.8, 3, 8);
  const engineMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
  const leftEngine = new THREE.Mesh(engineGeo, engineMat);
  leftEngine.position.set(-2.5, -0.5, 2);
  leftEngine.rotation.x = Math.PI / 2;
  group.add(leftEngine);
  const rightEngine = new THREE.Mesh(engineGeo, engineMat);
  rightEngine.position.set(2.5, -0.5, 2);
  rightEngine.rotation.x = Math.PI / 2;
  group.add(rightEngine);

  // Engine glow
  const glowGeo = new THREE.SphereGeometry(0.5, 6, 6);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x44aaff });
  const leftGlow = new THREE.Mesh(glowGeo, glowMat);
  leftGlow.position.set(-2.5, -0.5, 3.8);
  group.add(leftGlow);
  const rightGlow = new THREE.Mesh(glowGeo, glowMat);
  rightGlow.position.set(2.5, -0.5, 3.8);
  group.add(rightGlow);

  // Tail fins
  const finGeo = new THREE.BoxGeometry(0.2, 2, 1.5);
  const finMat = new THREE.MeshPhongMaterial({ color: 0x1144aa });
  const leftFin = new THREE.Mesh(finGeo, finMat);
  leftFin.position.set(-1.5, -1, -2);
  group.add(leftFin);
  const rightFin = new THREE.Mesh(finGeo, finMat);
  rightFin.position.set(1.5, -1, -2);
  group.add(rightFin);

  group.scale.set(0.8, 0.8, 0.8);
  return group;
}

// ===================== ENEMY CREATION =====================
function createEnemy(type, position) {
  const group = new THREE.Group();
  let hp = 1, speed = 0.5, scoreVal = 100, size = 0.8;

  if (type === 'fighter') {
    // Arrow-shaped fighter
    const bodyGeo = new THREE.ConeGeometry(1, 4, 4);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcc2222, flatShading: true });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.rotation.x = -Math.PI / 2;
    group.add(body);
    const wingGeo = new THREE.BoxGeometry(5, 0.15, 2);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0x991111 });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    group.add(wings);
    hp = 2; speed = 0.8; scoreVal = 150; size = 0.7;
  } else if (type === 'bomber') {
    // Bulky bomber
    const bodyGeo = new THREE.BoxGeometry(3, 2, 4);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x884400, flatShading: true });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    group.add(body);
    const wingGeo = new THREE.BoxGeometry(7, 0.2, 3);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0x663300 });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    group.add(wings);
    hp = 5; speed = 0.3; scoreVal = 300; size = 1.2;
  } else if (type === 'interceptor') {
    // Fast interceptor
    const bodyGeo = new THREE.ConeGeometry(0.6, 5, 4);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xaa44ff, flatShading: true });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.rotation.x = -Math.PI / 2;
    group.add(body);
    const wingGeo = new THREE.BoxGeometry(4, 0.1, 1.5);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0x7722cc });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    group.add(wings);
    hp = 1; speed = 1.5; scoreVal = 200; size = 0.6;
  } else if (type === 'turret') {
    // Stationary turret
    const baseGeo = new THREE.CylinderGeometry(1.5, 2, 1.5, 8);
    const baseMat = new THREE.MeshPhongMaterial({ color: 0x666666 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    group.add(base);
    const gunGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 6);
    const gunMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.y = 1.5;
    group.add(gun);
    hp = 4; speed = 0; scoreVal = 250; size = 1;
  }

  // Engine glow
  const glowGeo = new THREE.SphereGeometry(0.3, 4, 4);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.z = 2.5;
  group.add(glow);

  group.position.copy(position);
  group.scale.set(size, size, size);

  return { mesh: group, type, hp, maxHp: hp, speed, scoreVal, lastShot: 0, fireRate: type === 'turret' ? 1.5 : (type === 'bomber' ? 2 : 1), size };
}

// ===================== BOSS CREATION =====================
function createBoss(level) {
  const group = new THREE.Group();
  const colors = [0xcc0044, 0x00aa44, 0xaa4400, 0x4400aa, 0xff0000];
  const bossColors = [0xff2266, 0x22ff66, 0xff8800, 0x8800ff, 0xff0000];

  // Main hull
  const hullGeo = new THREE.BoxGeometry(12, 6, 18);
  const hullMat = new THREE.MeshPhongMaterial({ color: colors[level], flatShading: true });
  const hull = new THREE.Mesh(hullGeo, hullMat);
  group.add(hull);

  // Wings
  const wingGeo = new THREE.BoxGeometry(30, 1, 8);
  const wingMat = new THREE.MeshPhongMaterial({ color: bossColors[level], flatShading: true });
  const wings = new THREE.Mesh(wingGeo, wingMat);
  group.position.y = -1;
  group.add(wings);

  // Cockpit
  const cockpitGeo = new THREE.SphereGeometry(3, 8, 6);
  const cockpitMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
  const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
  cockpit.position.set(0, 2, 5);
  cockpit.scale.set(1, 0.5, 1.5);
  group.add(cockpit);

  // Cannons
  const cannonGeo = new THREE.CylinderGeometry(0.5, 0.5, 6, 6);
  const cannonMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
  for (let i = -1; i <= 1; i += 2) {
    const cannon = new THREE.Mesh(cannonGeo, cannonMat);
    cannon.position.set(i * 8, 0, 6);
    cannon.rotation.x = Math.PI / 2;
    group.add(cannon);
  }

  // Engine glows
  const glowGeo = new THREE.SphereGeometry(1.5, 6, 6);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
  for (let i = -1; i <= 1; i++) {
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.set(i * 5, -2, 9);
    group.add(glow);
  }

  group.scale.set(1.2, 1.2, 1.2);

  const hpValues = [30, 50, 70, 100, 150];
  const name = ['GENERAL ANDROSS', 'SLIMER BOSS', 'NEBULA GUARDIAN', 'ASTEROID KING', 'MASTER ORBOT'];
  const position = new THREE.Vector3(0, 0, -200);

  return { mesh: group, type: 'boss', hp: hpValues[level], maxHp: hpValues[level], speed: 0.3, scoreVal: 5000 + level * 2000, lastShot: 0, fireRate: 0.8, size: 3, name: name[level] };
}

// ===================== BULLET CREATION =====================
function createBullet(position, direction, isEnemy = false) {
  const geo = new THREE.SphereGeometry(0.3, 4, 4);
  const color = isEnemy ? 0xff4444 : 0x44ffff;
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);

  // Trail
  const trailGeo = new THREE.CylinderGeometry(0.1, 0.3, 2, 4);
  const trailMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 });
  const trail = new THREE.Mesh(trailGeo, trailMat);
  trail.rotation.x = Math.PI / 2;
  trail.position.z = -1;
  mesh.add(trail);

  scene.add(mesh);
  return { mesh, direction: direction.clone().normalize(), speed: isEnemy ? 1.5 : 4, life: 200 };
}

// ===================== PARTICLES =====================
function createExplosion(position, size = 1, color = 0xff8800) {
  const count = Math.floor(15 * size);
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.2 * size, 3, 3);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 2 * size,
      (Math.random() - 0.5) * 2 * size,
      (Math.random() - 0.5) * 2 * size
    );
    particles.push({ mesh, velocity: vel, life: 40 + Math.random() * 30, maxLife: 70 });
  }
}

function createPowerup(position, type) {
  const colors = { health: 0x00ff00, weapon: 0xffaa00, shield: 0x00aaff };
  const geo = new THREE.OctahedronGeometry(1, 0);
  const mat = new THREE.MeshPhongMaterial({ color: colors[type], emissive: colors[type], emissiveIntensity: 0.3, transparent: true, opacity: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);

  // Glow ring
  const ringGeo = new THREE.TorusGeometry(1.5, 0.1, 8, 16);
  const ringMat = new THREE.MeshBasicMaterial({ color: colors[type], transparent: true, opacity: 0.5 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  mesh.add(ring);

  return { mesh, type, life: 600 };
}

// ===================== STARS BACKGROUND =====================
function createStarfield() {
  const geo = new THREE.BufferGeometry();
  const positions = [];
  for (let i = 0; i < 8000; i++) {
    positions.push((Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}

// ===================== LEVEL DEFINITIONS =====================
const LEVELS = [
  {
    name: 'CORONAR SYSTEM',
    enemyTypes: ['fighter', 'interceptor'],
    enemyCount: 12,
    bossHP: 30,
    bossType: 'fighter',
    bg: 0x000011,
    fog: 0x000011,
    asteroidCount: 5,
    ambientColor: 0x223344
  },
  {
    name: 'VENOM OUTPOST',
    enemyTypes: ['fighter', 'bomber'],
    enemyCount: 16,
    bossHP: 50,
    bossType: 'bomber',
    bg: 0x110000,
    fog: 0x110000,
    asteroidCount: 8,
    ambientColor: 0x442222
  },
  {
    name: 'NEBULA SECTOR',
    enemyTypes: ['interceptor', 'bomber'],
    enemyCount: 20,
    bossHP: 70,
    bossType: 'interceptor',
    bg: 0x0a0015,
    fog: 0x0a0015,
    asteroidCount: 10,
    ambientColor: 0x332244
  },
  {
    name: 'ASTEROID BELT',
    enemyTypes: ['fighter', 'interceptor', 'turret'],
    enemyCount: 24,
    bossHP: 100,
    bossType: 'bomber',
    bg: 0x050510,
    fog: 0x050510,
    asteroidCount: 30,
    ambientColor: 0x222233
  },
  {
    name: 'ANDROSS FORTRESS',
    enemyTypes: ['fighter', 'bomber', 'interceptor', 'turret'],
    enemyCount: 30,
    bossHP: 150,
    bossType: 'fighter',
    bg: 0x150000,
    fog: 0x150000,
    asteroidCount: 15,
    ambientColor: 0x441111
  }
];

// ===================== LEVEL SETUP =====================
function setupLevel(levelIndex) {
  // Clear existing
  enemies.forEach(e => scene.remove(e.mesh));
  bullets.forEach(b => scene.remove(b.mesh));
  enemyBullets.forEach(b => scene.remove(b.mesh));
  particles.forEach(p => scene.remove(p.mesh));
  powerups.forEach(p => scene.remove(p.mesh));
  asteroids.forEach(a => scene.remove(a));
  if (boss) scene.remove(boss.mesh);

  enemies = []; bullets = []; enemyBullets = []; particles = []; powerups = []; asteroids = [];
  bossActive = false; boss = null; fireTimer = 0; boostEnergy = 100; isBoosting = false;

  const level = LEVELS[levelIndex];

  // Update scene
  scene.background = new THREE.Color(level.bg);
  scene.fog.color.setHex(level.fog);
  ambientLight.color.setHex(level.ambientColor);

  // Reset player
  if (!player) {
    player = createPlayerShip();
    scene.add(player);
  }
  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  player.health = 100;
  player.maxHealth = 100;

  camera.position.set(0, 5, 15);
  camera.lookAt(player.position);

  // Spawn enemies
  for (let i = 0; i < level.enemyCount; i++) {
    const type = level.enemyTypes[Math.floor(Math.random() * level.enemyTypes.length)];
    const pos = new THREE.Vector3(
      (Math.random() - 0.5) * 200,
      (Math.random() - 0.5) * 80,
      -100 - Math.random() * 300
    );
    const enemy = createEnemy(type, pos);
    scene.add(enemy.mesh);
    enemies.push(enemy);
  }

  // Spawn asteroids
  for (let i = 0; i < level.asteroidCount; i++) {
    const geo = new THREE.DodecahedronGeometry(3 + Math.random() * 8, 1);
    const mat = new THREE.MeshPhongMaterial({ color: 0x665544, flatShading: true });
    const asteroid = new THREE.Mesh(geo, mat);
    asteroid.position.set(
      (Math.random() - 0.5) * 300,
      (Math.random() - 0.5) * 100,
      -50 - Math.random() * 400
    );
    asteroid.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    asteroid.rotSpeed = { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02 };
    scene.add(asteroid);
    asteroids.push(asteroid);
  }

  // Spawn powerups
  for (let i = 0; i < 4; i++) {
    const types = ['health', 'weapon', 'shield'];
    const pos = new THREE.Vector3(
      (Math.random() - 0.5) * 150,
      (Math.random() - 0.5) * 60,
      -150 - Math.random() * 200
    );
    const pu = createPowerup(pos, types[Math.floor(Math.random() * types.length)]);
    scene.add(pu.mesh);
    powerups.push(pu);
  }

  // Update HUD
  document.getElementById('level-display').textContent = `LEVEL ${levelIndex + 1} - ${level.name}`;
  updateHealthBar();
  updateLivesDisplay();
  updateScore();
}

// ===================== INPUT HANDLING =====================
const keys = {};
let mouseX = 0, mouseY = 0;
let mouseWorldX = 0, mouseWorldY = 0;

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && gameState === STATE.PLAYING) {
    gameState = STATE.PAUSED;
    showMessage('PAUSED', 'Press P to resume');
  } else if (e.code === 'KeyP' && gameState === STATE.PAUSED) {
    gameState = STATE.PLAYING;
    hideMessage();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

document.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== UI FUNCTIONS =====================
function showMessage(title, subtitle) {
  const overlay = document.getElementById('message-overlay');
  overlay.classList.add('active');
  document.getElementById('message-title').textContent = title;
  document.getElementById('message-subtitle').textContent = subtitle;
  const btn = document.getElementById('message-btn');
  if (subtitle.includes('START') || subtitle.includes('RESTART') || subtitle.includes('NEXT')) {
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}

function hideMessage() {
  document.getElementById('message-overlay').classList.remove('active');
}

function updateHealthBar() {
  const pct = Math.max(0, player.health / player.maxHealth * 100);
  const bar = document.getElementById('health-bar');
  bar.style.width = pct + '%';
  if (pct > 60) bar.style.background = 'linear-gradient(90deg, #0f0, #0ff)';
  else if (pct > 30) bar.style.background = 'linear-gradient(90deg, #ff0, #fa0)';
  else bar.style.background = 'linear-gradient(90deg, #f00, #f60)';
}

function updateLivesDisplay() {
  document.getElementById('lives-display').textContent = '♥ '.repeat(lives).trim();
}

function updateScore() {
  document.getElementById('score-display').textContent = score.toLocaleString();
}

function showPowerup(text) {
  const el = document.getElementById('powerup-indicator');
  el.textContent = text;
  el.style.display = 'block';
  powerupTimer = 120;
}

function updateBossHUD() {
  const nameEl = document.getElementById('boss-name');
  const containerEl = document.getElementById('boss-health-container');
  if (bossActive && boss) {
    nameEl.style.display = 'block';
    nameEl.textContent = boss.name;
    containerEl.style.display = 'block';
    const pct = Math.max(0, boss.hp / boss.maxHp * 100);
    document.getElementById('boss-health-bar').style.width = pct + '%';
  } else {
    nameEl.style.display = 'none';
    containerEl.style.display = 'none';
  }
}

// ===================== MINIMAP =====================
function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 160, 160);

  // Background
  ctx.fillStyle = 'rgba(0,10,30,0.9)';
  ctx.beginPath();
  ctx.arc(80, 80, 76, 0, Math.PI * 2);
  ctx.fill();

  const scale = 0.3;
  const cx = 80, cy = 80;

  // Player
  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - 5);
  ctx.lineTo(cx - 4, cy + 4);
  ctx.lineTo(cx + 4, cy + 4);
  ctx.fill();

  // Enemies
  enemies.forEach(e => {
    const dx = (e.mesh.position.x - player.position.x) * scale;
    const dz = (e.mesh.position.z - player.position.z) * scale;
    if (Math.abs(dx) < 70 && Math.abs(dz) < 70) {
      ctx.fillStyle = '#f44';
      ctx.fillRect(cx + dx - 2, cy + dz - 2, 4, 4);
    }
  });

  // Boss
  if (bossActive && boss) {
    const dx = (boss.mesh.position.x - player.position.x) * scale;
    const dz = (boss.mesh.position.z - player.position.z) * scale;
    if (Math.abs(dx) < 70 && Math.abs(dz) < 70) {
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dz, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Powerups
  powerups.forEach(p => {
    const dx = (p.mesh.position.x - player.position.x) * scale;
    const dz = (p.mesh.position.z - player.position.z) * scale;
    if (Math.abs(dx) < 70 && Math.abs(dz) < 70) {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(cx + dx - 2, cy + dz - 2, 4, 4);
    }
  });

  // Border
  ctx.strokeStyle = 'rgba(0,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, 160, 160);
}

// ===================== SHOOTING =====================
let shootFlash = 0;

function playerShoot() {
  const dir = new THREE.Vector3(0, 0, -1);
  dir.applyQuaternion(player.quaternion);

  // Muzzle flash visual
  shootFlash = 5;

  if (weaponType === 'blaster') {
    bullets.push(createBullet(player.position.clone().add(dir.clone().multiplyScalar(3)), dir));
    bullets.push(createBullet(player.position.clone().add(dir.clone().multiplyScalar(3)), dir));
  } else if (weaponType === 'spread') {
    for (let i = -2; i <= 2; i++) {
      const spreadDir = dir.clone();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
      spreadDir.add(right.multiplyScalar(i * 0.15));
      bullets.push(createBullet(player.position.clone().add(dir.clone().multiplyScalar(3)), spreadDir));
    }
  } else if (weaponType === 'laser') {
    const laserGeo = new THREE.CylinderGeometry(0.15, 0.15, 20, 6);
    const laserMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
    const laser = new THREE.Mesh(laserGeo, laserMat);
    laser.position.copy(player.position).add(dir.clone().multiplyScalar(10));
    laser.rotation.x = Math.PI / 2;
    laser.quaternion.copy(player.quaternion);
    scene.add(laser);
    bullets.push({ mesh: laser, direction: dir.clone(), speed: 6, life: 30, isLaser: true });
  }
}

function enemyShoot(enemy) {
  const dir = player.position.clone().sub(enemy.mesh.position).normalize();
  // Add some inaccuracy
  dir.x += (Math.random() - 0.5) * 0.2;
  dir.y += (Math.random() - 0.5) * 0.2;
  enemyBullets.push(createBullet(enemy.mesh.position.clone(), dir, true));
}

function bossShoot(bossEntity) {
  const patterns = ['spread', 'aimed', 'circle'];
  const pattern = patterns[Math.floor(Math.random() * patterns.length)];
  const dir = player.position.clone().sub(bossEntity.mesh.position).normalize();

  if (pattern === 'spread') {
    for (let i = -2; i <= 2; i++) {
      const d = dir.clone();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(bossEntity.mesh.quaternion);
      d.add(right.multiplyScalar(i * 0.2));
      enemyBullets.push(createBullet(bossEntity.mesh.position.clone(), d, true));
    }
  } else if (pattern === 'aimed') {
    enemyBullets.push(createBullet(bossEntity.mesh.position.clone(), dir, true));
    enemyBullets.push(createBullet(bossEntity.mesh.position.clone(), dir.clone().add(new THREE.Vector3(0.1, 0, 0)), true));
    enemyBullets.push(createBullet(bossEntity.mesh.position.clone(), dir.clone().add(new THREE.Vector3(-0.1, 0, 0)), true));
  } else {
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const d = new THREE.Vector3(Math.cos(angle), Math.sin(angle) * 0.5, -1).normalize();
      enemyBullets.push(createBullet(bossEntity.mesh.position.clone(), d, true));
    }
  }
}

// ===================== COLLISION =====================
function checkCollision(obj1, pos1, obj2, pos2, radius = 3) {
  return pos1.distanceTo(pos2) < radius;
}

// ===================== GAME LOGIC =====================
function updatePlayer() {
  const speed = isBoosting ? 1.2 : 0.6;
  const moveSpeed = 1.5 * speed;

  // Keyboard movement
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
  const up = new THREE.Vector3(0, 1, 0);

  if (keys['KeyW'] || keys['ArrowUp']) player.position.add(forward.clone().multiplyScalar(moveSpeed));
  if (keys['KeyS'] || keys['ArrowDown']) player.position.add(forward.clone().multiplyScalar(-moveSpeed * 0.6));
  if (keys['KeyA'] || keys['ArrowLeft']) player.position.add(right.clone().multiplyScalar(-moveSpeed));
  if (keys['KeyD'] || keys['ArrowRight']) player.position.add(right.clone().multiplyScalar(moveSpeed));
  if (keys['KeyQ'] || keys['ArrowLeft']) player.position.y += moveSpeed * 0.7;
  if (keys['KeyE'] || keys['ArrowRight']) player.position.y -= moveSpeed * 0.7;

  // Mouse influence on movement
  player.position.x += mouseX * moveSpeed * 0.5;
  player.position.y += mouseY * moveSpeed * 0.5;

  // Clamp position
  player.position.x = Math.max(-150, Math.min(150, player.position.x));
  player.position.y = Math.max(-60, Math.min(60, player.position.y));
  player.position.z = Math.max(-50, Math.min(50, player.position.z));

  // Ship tilt
  const targetRotZ = -mouseX * 0.5;
  const targetRotX = mouseY * 0.3;
  player.rotation.z += (targetRotZ - player.rotation.z) * 0.1;
  player.rotation.x += (targetRotX - player.rotation.x) * 0.1;

  // Boost
  if (keys['ShiftLeft'] || keys['ShiftRight']) {
    if (boostEnergy > 0) {
      isBoosting = true;
      boostEnergy -= 0.5;
    } else {
      isBoosting = false;
    }
  } else {
    isBoosting = false;
    boostEnergy = Math.min(100, boostEnergy + 0.15);
  }

  // Shooting
  fireTimer++;
  const fireRate = weaponType === 'laser' ? 20 : (weaponType === 'spread' ? 15 : 8);
  if ((mouseDown || keys['Space']) && fireTimer >= fireRate) {
    playerShoot();
    fireTimer = 0;
  }

  // Muzzle flash decay
  if (shootFlash > 0) shootFlash--;

  // Fire indicator
  const fireEl = document.getElementById('fire-indicator');
  if (mouseDown || keys['Space']) {
    fireEl.style.opacity = '1';
    fireEl.textContent = 'FIRING [' + weaponType.toUpperCase() + ']';
  } else {
    fireEl.style.opacity = '0';
  }

  // Update camera
  const camTarget = player.position.clone().add(new THREE.Vector3(0, 4, 12));
  camera.position.lerp(camTarget, 0.08);
  const lookTarget = player.position.clone().add(new THREE.Vector3(0, 0, -10));
  camera.lookAt(lookTarget);

  // Engine glow animation
  if (player.children[5]) player.children[5].scale.setScalar(0.8 + Math.sin(frameCount * 0.3) * 0.3);
  if (player.children[6]) player.children[6].scale.setScalar(0.8 + Math.sin(frameCount * 0.3 + 1) * 0.3);

  updateHealthBar();
}

function updateEnemies() {
  enemies.forEach((enemy, idx) => {
    const dir = player.position.clone().sub(enemy.mesh.position);
    const dist = dir.length();
    dir.normalize();

    // Movement AI
    if (enemy.type === 'fighter') {
      enemy.mesh.position.add(dir.multiplyScalar(enemy.speed));
      // strafe
      const strafe = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(Math.sin(frameCount * 0.03) * 0.5);
      enemy.mesh.position.add(strafe);
    } else if (enemy.type === 'interceptor') {
      enemy.mesh.position.add(dir.multiplyScalar(enemy.speed));
      if (dist < 80) {
        // Dive bomb
        enemy.mesh.position.y += Math.sin(frameCount * 0.1) * 2;
      }
    } else if (enemy.type === 'bomber') {
      // Circle around player
      const angle = frameCount * 0.01;
      const targetPos = new THREE.Vector3(
        player.position.x + Math.cos(angle) * 60,
        player.position.y + Math.sin(angle * 0.5) * 20,
        player.position.z + 40 + Math.sin(angle * 0.7) * 20
      );
      enemy.mesh.position.lerp(targetPos, 0.01);
    } else if (enemy.type === 'turret') {
      // Rotate to face player
      enemy.mesh.lookAt(player.position.x, enemy.mesh.position.y, player.position.z);
    }

    // Face player
    enemy.mesh.lookAt(player.position.x, enemy.mesh.position.y, enemy.mesh.position.z - 1);

    // Shooting
    if (dist < 200 && frameCount % Math.floor(60 / enemy.fireRate) === 0) {
      enemyShoot(enemy);
    }

    // Collision with player
    if (checkCollision(null, enemy.mesh.position, null, player.position, 5)) {
      player.health -= 15;
      shakeAmount = 5;
      createExplosion(enemy.mesh.position, 0.8);
      scene.remove(enemy.mesh);
      enemies.splice(idx, 1);
      if (player.health <= 0) playerDie();
    }
  });
}

function updateBoss() {
  if (!bossActive || !boss) return;

  // Boss movement patterns
  const t = frameCount * 0.015;
  boss.mesh.position.x = Math.sin(t) * 50;
  boss.mesh.position.y = Math.cos(t * 0.7) * 25;
  boss.mesh.position.z = -200 + Math.sin(t * 0.3) * 30;

  // Face player
  boss.mesh.lookAt(player.position.x, player.position.y, player.position.z);

  // Shooting
  if (frameCount % Math.floor(48 / boss.fireRate) === 0) {
    bossShoot(boss);
  }

  // Collision with player
  if (checkCollision(null, boss.mesh.position, null, player.position, 12)) {
    player.health -= 25;
    shakeAmount = 8;
    createExplosion(player.position.clone(), 1);
    if (player.health <= 0) playerDie();
  }

  updateBossHUD();
}

function updateBullets() {
  // Player bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.add(b.direction.clone().multiplyScalar(b.speed));
    b.life--;

    if (b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }

    // Check enemy hits
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (checkCollision(null, b.mesh.position, null, e.mesh.position, e.size + 1)) {
        e.hp--;
        createExplosion(b.mesh.position.clone(), 0.3, 0x44ffff);
        if (b.isLaser) continue; // Lasers pierce
        hit = true;
        if (e.hp <= 0) {
          score += e.scoreVal;
          updateScore();
          createExplosion(e.mesh.position.clone(), e.size, 0xff8800);
          scene.remove(e.mesh);
          enemies.splice(j, 1);

          // Chance to drop powerup
          if (Math.random() < 0.15) {
            const types = ['health', 'weapon', 'shield'];
            const pu = createPowerup(e.mesh.position.clone(), types[Math.floor(Math.random() * types.length)]);
            scene.add(pu.mesh);
            powerups.push(pu);
          }
        }
        break;
      }
    }

    // Check boss hit
    if (!hit && bossActive && boss) {
      if (checkCollision(null, b.mesh.position, null, boss.mesh.position, boss.size + 2)) {
        boss.hp--;
        createExplosion(b.mesh.position.clone(), 0.5, 0xff4444);
        shakeAmount = 2;
        if (!b.isLaser) hit = true;
        if (boss.hp <= 0) {
          score += boss.scoreVal;
          updateScore();
          createExplosion(boss.mesh.position.clone(), 3, 0xff4400);
          createExplosion(boss.mesh.position.clone(), 2.5, 0xffaa00);
          createExplosion(boss.mesh.position.clone(), 2, 0xffff00);
          scene.remove(boss.mesh);
          bossActive = false;
          boss = null;
          updateBossHUD();
          levelComplete();
        }
      }
    }

    if (hit && !b.isLaser) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // Enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.mesh.position.add(b.direction.clone().multiplyScalar(b.speed));
    b.life--;

    if (b.life <= 0) {
      scene.remove(b.mesh);
      enemyBullets.splice(i, 1);
      continue;
    }

    // Hit player
    if (checkCollision(null, b.mesh.position, null, player.position, 3)) {
      player.health -= 8;
      shakeAmount = 3;
      createExplosion(b.mesh.position.clone(), 0.4, 0xff4444);
      scene.remove(b.mesh);
      enemyBullets.splice(i, 1);
      if (player.health <= 0) playerDie();
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.add(p.velocity);
    p.velocity.multiplyScalar(0.96);
    p.life--;
    p.mesh.material.opacity = p.life / p.maxLife;
    p.mesh.material.transparent = true;

    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

function updatePowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.mesh.rotation.y += 0.05;
    pu.mesh.rotation.x += 0.02;
    pu.mesh.position.y += Math.sin(frameCount * 0.05) * 0.05;
    pu.life--;

    if (pu.life <= 0) {
      scene.remove(pu.mesh);
      powerups.splice(i, 1);
      continue;
    }

    if (checkCollision(null, pu.mesh.position, null, player.position, 5)) {
      if (pu.type === 'health') {
        player.health = Math.min(player.maxHealth, player.health + 30);
        showPowerup('+SHIELD RESTORED');
      } else if (pu.type === 'weapon') {
        const weapons = ['blaster', 'spread', 'laser'];
        weaponType = weapons[(weapons.indexOf(weaponType) + 1) % weapons.length];
        showPowerup('WEAPON: ' + weaponType.toUpperCase());
      } else if (pu.type === 'shield') {
        player.health = player.maxHealth;
        showPowerup('FULL SHIELD!');
      }
      score += 50;
      updateScore();
      createExplosion(pu.mesh.position.clone(), 0.5, 0xffff00);
      scene.remove(pu.mesh);
      powerups.splice(i, 1);
    }
  }

  if (powerupTimer > 0) {
    powerupTimer--;
    if (powerupTimer <= 0) {
      document.getElementById('powerup-indicator').style.display = 'none';
    }
  }
}

function updateAsteroids() {
  asteroids.forEach(a => {
    a.rotation.x += a.rotSpeed.x;
    a.rotation.y += a.rotSpeed.y;
    // Slowly drift toward player
    a.position.z += 0.1;
    if (a.position.z > player.position.z + 50) {
      a.position.z = player.position.z - 400 - Math.random() * 200;
      a.position.x = player.position.x + (Math.random() - 0.5) * 300;
      a.position.y = player.position.y + (Math.random() - 0.5) * 100;
    }
  });
}

function updateStars() {
  // Parallax starfield
  stars.position.x = player.position.x * 0.05;
  stars.position.y = player.position.y * 0.05;
}

// ===================== GAME FLOW =====================
function playerDie() {
  lives--;
  updateLivesDisplay();
  createExplosion(player.position.clone(), 2, 0x4488ff);
  shakeAmount = 10;

  if (lives <= 0) {
    gameOver();
  } else {
    player.health = player.maxHealth;
    player.position.set(0, 0, 0);
    // Clear nearby bullets
    enemyBullets = [];
    scene.children.filter(c => c.isMesh && c.material && c.material.color && c.material.color.getHex() === 0xff4444).forEach(m => scene.remove(m));
  }
}

function levelComplete() {
  if (currentLevel >= LEVELS.length - 1) {
    gameState = STATE.WIN;
    showMessage('MISSION COMPLETE!', `Final Score: ${score.toLocaleString()} - You saved the Lylat System!`);
    document.getElementById('message-btn').style.display = 'block';
    document.getElementById('message-btn').textContent = 'PLAY AGAIN';
  } else {
    gameState = STATE.LEVELCOMPLETE;
    showMessage(`LEVEL ${currentLevel + 1} COMPLETE!`, `Score: ${score.toLocaleString()} | Next: ${LEVELS[currentLevel + 1].name}`);
    document.getElementById('message-btn').style.display = 'block';
    document.getElementById('message-btn').textContent = 'NEXT MISSION';
  }
}

function gameOver() {
  gameState = STATE.GAMEOVER;
  showMessage('GAME OVER', `Final Score: ${score.toLocaleString()}`);
  document.getElementById('message-btn').style.display = 'block';
  document.getElementById('message-btn').textContent = 'TRY AGAIN';
}

function startGame() {
  hideMessage();
  score = 0;
  lives = 3;
  currentLevel = 0;
  weaponType = 'blaster';
  updateScore();
  updateLivesDisplay();
  setupLevel(currentLevel);
  gameState = STATE.PLAYING;

  // Spawn boss when all enemies are defeated
}

function nextLevel() {
  hideMessage();
  currentLevel++;
  setupLevel(currentLevel);
  gameState = STATE.PLAYING;
}

// Override message button behavior
document.getElementById('message-btn').addEventListener('click', () => {
  if (gameState === STATE.WIN || gameState === STATE.GAMEOVER) {
    startGame();
  } else if (gameState === STATE.LEVELCOMPLETE) {
    nextLevel();
  }
});

// ===================== CHECK BOSS SPAWN =====================
function checkBossSpawn() {
  if (!bossActive && enemies.length === 0 && boss === null) {
    bossActive = true;
    boss = createBoss(currentLevel);
    scene.add(boss.mesh);
    updateBossHUD();
  }
}

// ===================== MAIN GAME LOOP =====================
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  deltaTime = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  frameCount++;

  // Camera shake
  if (shakeAmount > 0) {
    camera.position.x += (Math.random() - 0.5) * shakeAmount * 0.1;
    camera.position.y += (Math.random() - 0.5) * shakeAmount * 0.1;
    shakeAmount *= 0.9;
    if (shakeAmount < 0.1) shakeAmount = 0;
  }

  if (gameState === STATE.PLAYING) {
    updatePlayer();
    updateEnemies();
    updateBoss();
    updateBullets();
    updateParticles();
    updatePowerups();
    updateAsteroids();
    updateStars();
    checkBossSpawn();
    updateMinimap();

    // Update weapon display
    document.getElementById('weapon-display').textContent = weaponType.toUpperCase();
  }

  renderer.render(scene, camera);
}

// ===================== INITIALIZATION =====================
function init() {
  // Create starfield
  stars = createStarfield();
  scene.add(stars);

  // Initial scene setup
  scene.background = new THREE.Color(0x000011);

  // Show start screen
  showMessage('STAR FOX', 'Space Combat Mission - Press START to play!');

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

init();
