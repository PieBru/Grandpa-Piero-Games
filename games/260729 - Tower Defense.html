<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #eee;
  }
  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 800px;
    background: #16213e;
    border-radius: 10px;
    padding: 10px 20px;
    border: 2px solid #0f3460;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    font-weight: bold;
  }
  .stat .icon { font-size: 20px; }
  .stat .label { color: #a0a0c0; font-size: 13px; }
  .stat .value { color: #ffd700; font-size: 18px; }
  #towers {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .tower-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 2px solid #333;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.2s;
    color: #fff;
    background: #2a2a4a;
  }
  .tower-btn:hover { transform: scale(1.05); }
  .tower-btn.selected { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .tower-btn.t1 { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
  .tower-btn.t2 { background: linear-gradient(135deg, #ef5350, #b71c1c); }
  .tower-btn.t3 { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
  #canvas {
    border-radius: 10px;
    border: 2px solid #0f3460;
    cursor: crosshair;
    display: block;
  }
  #bottomBar {
    display: flex;
    gap: 15px;
    align-items: center;
    width: 800px;
  }
  #waveBtn {
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(135deg, #ffd700, #ff8f00);
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #waveBtn:hover { transform: scale(1.05); box-shadow: 0 0 15px #ffd700; }
  #waveBtn:disabled { background: #555; color: #999; cursor: not-allowed; transform: none; box-shadow: none; }
  #restartBtn {
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(135deg, #e91e63, #880e4f);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #restartBtn:hover { transform: scale(1.05); box-shadow: 0 0 15px #e91e63; }
  #info {
    font-size: 13px;
    color: #a0a0c0;
    flex: 1;
  }
  #overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #overlay.show { display: flex; }
  #overlayBox {
    background: #16213e;
    border: 3px solid #ffd700;
    border-radius: 20px;
    padding: 40px 60px;
    text-align: center;
  }
  #overlayBox h1 { font-size: 48px; margin-bottom: 10px; }
  #overlayBox p { font-size: 20px; color: #a0a0c0; margin-bottom: 20px; }
  #overlayBox button {
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(135deg, #ffd700, #ff8f00);
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #overlayBox button:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="topBar">
    <div class="stat"><span class="icon">💰</span><div><div class="label">Money</div><div class="value" id="moneyVal">100</div></div></div>
    <div class="stat"><span class="icon">❤️</span><div><div class="label">Lives</div><div class="value" id="livesVal">20</div></div></div>
    <div class="stat"><span class="icon">🌊</span><div><div class="label">Wave</div><div class="value" id="waveVal">0</div></div></div>
    <div class="stat"><span class="icon">⭐</span><div><div class="label">Score</div><div class="value" id="scoreVal">0</div></div></div>
    <div id="towers">
      <div class="tower-btn t1 selected" data-type="0">🔵 Blaster $50</div>
      <div class="tower-btn t2" data-type="1">🔥 Sniper $100</div>
      <div class="tower-btn t3" data-type="2">❄️ Slow $75</div>
    </div>
  </div>
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="bottomBar">
    <button id="waveBtn">▶ Start Wave</button>
    <button id="restartBtn">↺ Restart</button>
    <div id="info">Click a tower above, then click the map to place it. Defeat enemies to earn money!</div>
  </div>
</div>
<div id="overlay">
  <div id="overlayBox">
    <h1 id="overlayTitle">Game Over</h1>
    <p id="overlayMsg">You survived 0 waves!</p>
    <button id="overlayBtn" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CELL = 40;
const COLS = W / CELL, ROWS = H / CELL;

// Path waypoints (grid coords)
const pathPoints = [
  {x:0,y:5},{x:3,y:5},{x:3,y:2},{x:7,y:2},{x:7,y:8},{x:11,y:8},
  {x:11,y:4},{x:15,y:4},{x:15,y:9},{x:19,y:9},{x:19,y:6},{x:20,y:6}
];

// Convert to pixel coords (center of cell)
const path = pathPoints.map(p => ({x: p.x * CELL + CELL/2, y: p.y * CELL + CELL/2}));

// Precompute path segments for movement
let pathSegments = [];
let totalPathLength = 0;
for(let i=1;i<path.length;i++){
  let dx=path[i].x-path[i-1].x, dy=path[i].y-path[i-1].y;
  let len=Math.sqrt(dx*dx+dy*dy);
  pathSegments.push({from:path[i-1], to:path[i], len:len, cumLen:totalPathLength});
  totalPathLength+=len;
}

// Which cells are on the path
const pathCells = new Set();
for(let i=0;i<pathPoints.length-1;i++){
  let a=pathPoints[i], b=pathPoints[i+1];
  let dx=Math.sign(b.x-a.x), dy=Math.sign(b.y-a.y);
  let cx=a.x, cy=a.y;
  while(cx!==b.x||cy!==b.y){
    pathCells.add(cx+','+cy);
    if(cx!==b.x) cx+=dx;
    if(cy!==b.y) cy+=dy;
  }
  pathCells.add(b.x+','+b.y);
}

// Tower definitions
const TOWER_DEFS = [
  {name:'Blaster', cost:50, range:120, damage:20, fireRate:0.8, color:'#4fc3f7', projectileColor:'#81d4fa', projectileSpeed:300, splash:0},
  {name:'Sniper', cost:100, range:200, damage:80, fireRate:0.3, color:'#ef5350', projectileColor:'#ff8a80', projectileSpeed:600, splash:0},
  {name:'Slow', cost:75, range:100, damage:8, fireRate:1.2, color:'#66bb6a', projectileColor:'#a5d6a7', projectileSpeed:200, splash:0, slowFactor:0.4, slowDuration:2}
];

let money, lives, wave, score;
let enemies, towers, projectiles, particles;
let selectedTowerType = 0;
let waveActive, waveEnemies, spawnTimer, spawnIndex;
let gameOver;
let lastTime;

function init(){
  money=100; lives=20; wave=0; score=0;
  enemies=[]; towers=[]; projectiles=[]; particles=[];
  waveActive=false; waveEnemies=[]; spawnTimer=0; spawnIndex=0;
  gameOver=false;
  document.getElementById('overlay').classList.remove('show');
  updateUI();
}

function restartGame(){ init(); lastTime=performance.now(); requestAnimationFrame(gameLoop); }

function updateUI(){
  document.getElementById('moneyVal').textContent=money;
  document.getElementById('livesVal').textContent=lives;
  document.getElementById('waveVal').textContent=wave;
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('waveBtn').disabled=waveActive;
}

// Tower button selection
document.querySelectorAll('.tower-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTowerType=parseInt(btn.dataset.type);
  });
});

// Canvas click - place tower
canvas.addEventListener('click',(e)=>{
  if(gameOver||waveActive) return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const cx=Math.floor(mx/CELL), cy=Math.floor(my/CELL);
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return;
  if(pathCells.has(cx+','+cy)) return;
  // Check if tower already there
  for(let t of towers){ if(t.gx===cx&&t.gy===cy) return; }
  const def=TOWER_DEFS[selectedTowerType];
  if(money<def.cost){ document.getElementById('info').textContent='Not enough money!'; setTimeout(()=>document.getElementById('info').textContent='',1500); return; }
  money-=def.cost;
  towers.push({
    gx:cx, gy:cy,
    x:cx*CELL+CELL/2, y:cy*CELL+CELL/2,
    type:selectedTowerType,
    cooldown:0, angle:0,
    def:{...def}
  });
  updateUI();
  // Placement particles
  for(let i=0;i<8;i++){
    const a=Math.PI*2*i/8;
    particles.push({x:cx*CELL+CELL/2,y:cy*CELL+CELL/2,vx:Math.cos(a)*80,vy:Math.sin(a)*80,life:0.4,maxLife:0.4,color:def.color,r:4});
  }
});

function startWave(){
  if(waveActive||gameOver) return;
  wave++;
  waveActive=true;
  const count=5+wave*3;
  waveEnemies=[];
  for(let i=0;i<count;i++){
    let hp=30+wave*20;
    let speed=60+wave*5;
    let reward=10+Math.floor(wave*1.5);
    // Mix in stronger enemies every few waves
    if(wave%3===0&&i%4===0){ hp*=2; speed*=0.7; reward+=15; }
    if(wave%5===0&&i%5===0){ hp*=1.5; speed*=1.3; reward+=10; }
    waveEnemies.push({hp,maxHp:hp,speed,reward,x:path[0].x,y:path[0].y,dist:0});
  }
  spawnTimer=0; spawnIndex=0;
  updateUI();
}

function dist(a,b){ return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2); }

function getEnemyPosAtDist(d){
  let remaining=d;
  for(let seg of pathSegments){
    if(remaining<=seg.len) {
      const t=remaining/seg.len;
      return {x:seg.from.x+(seg.to.x-seg.from.x)*t, y:seg.from.y+(seg.to.y-seg.from.y)*t};
    }
    remaining-=seg.len;
  }
  return path[path.length-1];
}

function gameLoop(time){
  if(gameOver) return;
  const dt=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;

  // Spawn enemies
  if(waveActive && spawnIndex<waveEnemies.length){
    spawnTimer-=dt;
    if(spawnTimer<=0){
      let e=waveEnemies[spawnIndex];
      enemies.push({hp:e.hp,maxHp:e.maxHp,speed:e.speed,reward:e.reward,x:path[0].x,y:path[0].y,dist:0});
      spawnIndex++;
      spawnTimer=0.8-wave*0.02;
      if(spawnTimer<0.3) spawnTimer=0.3;
    }
  }

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i];
    let spd=e.speed;
    // Apply slow effect
    if(e.slowTimer>0){ spd*=e.slowFactor; e.slowTimer-=dt; }
    e.dist+=spd*dt;
    const pos=getEnemyPosAtDist(e.dist);
    e.x=pos.x; e.y=pos.y;
    if(e.dist>=totalPathLength){
      lives--;
      enemies.splice(i,1);
      if(lives<=0){ endGame(false); }
      updateUI();
    }
  }

  // Update towers (find targets and shoot)
  for(let t of towers){
    t.cooldown-=dt;
    // Find closest enemy in range
    let closest=null, closestDist=Infinity;
    for(let e of enemies){
      const d=dist(t,e);
      if(d<=t.def.range && d<closestDist){ closestDist=d; closest=e; }
    }
    if(closest){
      t.angle=Math.atan2(closest.y-t.y, closest.x-t.x);
      if(t.cooldown<=0){
        t.cooldown=t.def.fireRate;
        // Create projectile
        projectiles.push({
          x:t.x, y:t.y,
          target:closest,
          speed:t.def.projectileSpeed,
          damage:t.def.damage,
          color:t.def.projectileColor,
          slowFactor:t.def.slowFactor||0,
          slowDuration:t.def.slowDuration||0,
          r: t.type===1?5:4
        });
      }
    }
  }

  // Update projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    let p=projectiles[i];
    if(!enemies.includes(p.target)){ projectiles.splice(i,1); continue; }
    const dx=p.target.x-p.x, dy=p.target.y-p.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<p.speed*dt+5){
      // Hit
      p.target.hp-=p.damage;
      if(p.slowFactor>0){ p.target.slowTimer=p.slowDuration; p.target.slowFactor=p.slowFactor; }
      // Hit particles
      for(let j=0;j<4;j++){
        const a=Math.random()*Math.PI*2;
        particles.push({x:p.x,y:p.y,vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:0.3,maxLife:0.3,color:p.color,r:3});
      }
      if(p.target.hp<=0){
        const idx=enemies.indexOf(p.target);
        if(idx>=0){
          money+=p.target.reward;
          score+=p.target.reward*2;
          // Death particles
          for(let j=0;j<12;j++){
            const a=Math.random()*Math.PI*2;
            particles.push({x:p.target.x,y:p.target.y,vx:Math.cos(a)*100,vy:Math.sin(a)*100,life:0.5,maxLife:0.5,color:'#ffd700',r:5});
          }
          enemies.splice(idx,1);
        }
        updateUI();
      }
      projectiles.splice(i,1);
    } else {
      p.x+=dx/d*p.speed*dt;
      p.y+=dy/d*p.speed*dt;
    }
  }

  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }

  // Check wave complete
  if(waveActive && spawnIndex>=waveEnemies.length && enemies.length===0){
    waveActive=false;
    money+=20+wave*5; // Wave clear bonus
    updateUI();
    document.getElementById('info').textContent='Wave '+wave+' complete! Place towers and start the next wave!';
    setTimeout(()=>{ if(!gameOver) document.getElementById('info').textContent='Click a tower above, then click the map to place it.'; },3000);
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function endGame(won){
  gameOver=true;
  const overlay=document.getElementById('overlay');
  document.getElementById('overlayTitle').textContent=won?'You Win!':'Game Over';
  document.getElementById('overlayMsg').textContent='You survived '+wave+' waves! Score: '+score;
  overlay.classList.add('show');
}

function draw(){
  // Background
  ctx.fillStyle='#1a2744';
  ctx.fillRect(0,0,W,H);

  // Grid (subtle)
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  for(let x=0;x<=W;x+=CELL){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=CELL){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Draw path
  ctx.fillStyle='#3d2b1f';
  for(let key of pathCells){
    const [cx,cy]=key.split(',').map(Number);
    ctx.fillRect(cx*CELL+1,cy*CELL+1,CELL-2,CELL-2);
  }
  // Path border/road effect
  ctx.strokeStyle='#5a3d2b';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(path[0].x,path[0].y);
  for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y);
  ctx.stroke();

  // Path direction arrows
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=1;i<pathSegments.length;i++){
    const seg=pathSegments[i];
    const mx=(seg.from.x+seg.to.x)/2, my=(seg.from.y+seg.to.y)/2;
    const angle=Math.atan2(seg.to.y-seg.from.y,seg.to.x-seg.from.x);
    ctx.save();
    ctx.translate(mx,my);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(8,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Draw range indicator for hovered/selected area (show preview)
  // (handled by mousemove if needed, skipping for simplicity)

  // Draw tower ranges (subtle)
  for(let t of towers){
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.def.range,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }

  // Draw towers
  for(let t of towers){
    const def=t.def;
    // Base
    ctx.fillStyle='#1a1a2e';
    ctx.strokeStyle=def.color;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(t.x,t.y,14,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // Turret direction
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.rotate(t.angle);
    ctx.fillStyle=def.color;
    if(t.type===0){
      ctx.fillRect(-4,-4,12,8);
      ctx.beginPath();
      ctx.arc(0,0,7,0,Math.PI*2);
      ctx.fill();
    } else if(t.type===1){
      ctx.fillRect(-3,-2,16,4);
      ctx.beginPath();
      ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(-3,-3,14,6);
      ctx.beginPath();
      ctx.arc(0,0,7,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    // Center dot
    ctx.fillStyle=def.color;
    ctx.beginPath();
    ctx.arc(t.x,t.y,4,0,Math.PI*2);
    ctx.fill();
  }

  // Draw enemies
  for(let e of enemies){
    const r=12;
    // Body
    const grad=ctx.createRadialGradient(e.x-3,e.y-3,2,e.x,e.y,r);
    if(e.slowTimer>0){
      grad.addColorStop(0,'#81d4fa');
      grad.addColorStop(1,'#0277bd');
    } else {
      const hue=Math.max(0, 60-e.hp*0.3);
      grad.addColorStop(0,`hsl(${hue},80%,60%)`);
      grad.addColorStop(1,`hsl(${hue},80%,30%)`);
    }
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(e.x,e.y,r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=1;
    ctx.stroke();
    // Eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(e.x-4,e.y-2,3,0,Math.PI*2);
    ctx.arc(e.x+4,e.y-2,3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();
    ctx.arc(e.x-3,e.y-1,1.5,0,Math.PI*2);
    ctx.arc(e.x+5,e.y-1,1.5,0,Math.PI*2);
    ctx.fill();

    // Health bar
    const bw=24, bh=4;
    ctx.fillStyle='#333';
    ctx.fillRect(e.x-bw/2,e.y-r-8,bw,bh);
    const hpPct=e.hp/e.maxHp;
    const barColor=hpPct>0.5?'#4caf50':hpPct>0.25?'#ff9800':'#f44336';
    ctx.fillStyle=barColor;
    ctx.fillRect(e.x-bw/2,e.y-r-8,bw*hpPct,bh);
  }

  // Draw projectiles
  for(let p of projectiles){
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }

  // Draw particles
  for(let p of particles){
    const alpha=p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Start/End markers
  ctx.font='bold 16px sans-serif';
  ctx.fillStyle='#4fc3f7';
  ctx.fillText('▶', 8, path[0].y+5);
  ctx.fillStyle='#ef5350';
  ctx.fillText('⏻', W-20, path[path.length-1].y+5);
}

// Mouse tracking for tower preview
canvas.addEventListener('mousemove',(e)=>{
  if(gameOver||waveActive) return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const cx=Math.floor(mx/CELL), cy=Math.floor(my/CELL);
  // Already handled in click, just visual feedback could be added here
});

// Wave button
document.getElementById('waveBtn').addEventListener('click',startWave);
document.getElementById('restartBtn').addEventListener('click',restartGame);

init();
lastTime=performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
